import lit.formats

# name: The name of this test suite.
config.name = 'hermes-node-Unit'

# The GoogleTest format discovers the test binaries itself, so there are no
# test files to match by extension.
config.suffixes = []

# The tests are the built executables, not the sources next to this file.
config.test_exec_root = lit_config.params['unittests_dir']
config.test_source_root = config.test_exec_root

# Our unit test binaries are named <Name>Test, unlike Hermes's <Name>Tests.
config.test_format = lit.formats.GoogleTest('.', 'Test')
