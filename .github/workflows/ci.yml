name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100

      - name: Run format check
        run: ./utils/format.sh --check

  build-and-test:
    name: Build & test (${{ matrix.os }}, ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        config: [asan-debug-o1, release]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 ccache \
                                  clang-18 lld-18 \
                                  libgl1-mesa-dev libx11-dev libxi-dev \
                                  libxcursor-dev libgl1-mesa-dri xvfb

      # The four -dev packages above are what lib/compositor-gpu needs to
      # configure at all: it find_package()s OpenGL and X11 as REQUIRED, and
      # sokol_app links X11, Xi and Xcursor. They are installed for BOTH
      # Linux configurations rather than only the asan one that sets
      # HERMES_NODE_ENABLE_UI, because apt is a step and the option is a
      # later one -- and an unused development package costs a runner
      # nothing.
      #
      # libgl1-mesa-dri and xvfb are for running rather than building, and
      # they are the pair that decides whether the window tests execute or
      # report UNSUPPORTED. xvfb provides the display the `display` lit
      # feature probes for and the RUN lines start; libgl1-mesa-dri provides
      # the llvmpipe software renderer that gives that display a GL 4.3 core
      # context. Without the DRI package the display starts, the feature
      # turns on, and the tests fail for want of a renderer -- which is the
      # loud outcome, and the right one, but it is worth not arranging.

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja ccache

      - name: Compute ccache path
        id: ccache-path
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "path=$HOME/Library/Caches/ccache" >> "$GITHUB_OUTPUT"
          else
            echo "path=$HOME/.cache/ccache" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ steps.ccache-path.outputs.path }}
          key: ccache-${{ matrix.os }}-${{ matrix.config }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ matrix.config }}-

      - name: Configure ccache
        run: ccache -M 3G

      - name: Configure CMake
        shell: bash
        run: |
          common_args=(
            -B build
            -G Ninja
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          )
          if [ "$RUNNER_OS" = "Linux" ]; then
            common_args+=(
              -DCMAKE_C_COMPILER=clang-18
              -DCMAKE_CXX_COMPILER=clang++-18
            )
          fi
          case "${{ matrix.config }}" in
            asan-debug-o1)
              # HERMES_NODE_ENABLE_UI is ON here and nowhere else, on
              # purpose. unittests/CMakeLists.txt guards CompositorTest on
              # this option, so without it the target is never created and
              # the whole compositor -- every test in it -- can regress
              # green indefinitely. The ASAN job is the one that should
              # carry it: the surface protocol's tests are concurrent, and
              # several of them exist to catch a use-after-free.
              #
              # The release job deliberately stays without it, which is what
              # keeps the plan's Global Constraint -- a build WITHOUT the
              # option is unaffected -- an actually exercised configuration
              # rather than an assumption.
              common_args+=(
                -DCMAKE_BUILD_TYPE=Debug
                -DHERMES_ENABLE_ADDRESS_SANITIZER=ON
                -DHERMESVM_SANITIZE_HANDLES=ON
                -DHERMES_NODE_ENABLE_UI=ON
                -DCMAKE_C_FLAGS_DEBUG_INIT="-g -O1"
                -DCMAKE_CXX_FLAGS_DEBUG_INIT="-g -O1"
              )
              ;;
            release)
              common_args+=(
                -DCMAKE_BUILD_TYPE=Release
              )
              ;;
          esac
          cmake "${common_args[@]}"

      - name: ccache stats (before build)
        run: ccache -s

      - name: Build & test
        run: cmake --build build --target check-hermes-node

      - name: ccache stats (after build)
        if: always()
        run: ccache -s

      # The --build-exe tests deliberately keep their output when they fail,
      # so the evidence survives the run. That output is a linked
      # hermes-node -- 185 MB under ASAN -- and build-exe-escapes.js keeps
      # two of them. Without the exclusion below, one gated failure turns
      # this step into a multi-hundred-megabyte upload of binaries nobody
      # will debug out of a zip. The exclusion is a pattern, not a YAML
      # comment: `path` is a block scalar, so every line in it is a glob.
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.config }}
          path: |
            build/test/
            build/unittests/
            !build/test/Output/build-exe*
          if-no-files-found: ignore
