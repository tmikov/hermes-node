import os
import subprocess
import sys
import lit.formats

config.name = 'hermes-node'
config.test_format = lit.formats.ShTest(True)
config.suffixes = ['.js', '.ts']
config.test_source_root = os.path.dirname(__file__)
config.test_exec_root = lit_config.params['test_exec_root']

# The compile cache is on by default. Off for the suite as a whole so tests
# never share state through the user's real cache directory and ordering does
# not become a variable; the compile-cache tests opt back in explicitly with
# their own directory, through the %hermes-node-cc substitution below.
#
# lit's ShTest replaces the environment rather than merging with the ambient
# one, which is why PATH has to be passed through explicitly.
config.environment['HERMES_NODE_DISABLE_COMPILE_CACHE'] = '1'
config.environment['PATH'] = os.environ.get('PATH', '')
# Point the default cache root inside the test tree. The suite-wide disable
# above is the primary guard, but %hermes-node-cc exists to clear it, so a
# future test that forgets to pass --compile-cache= would otherwise land in
# the developer's real ~/.cache. lit's default environment carries no HOME,
# so this is the only root that needs redirecting.
config.environment['XDG_CACHE_HOME'] = os.path.join(
    config.test_exec_root, 'xdg-cache')

# Substitutions (order matters: longer names first to avoid prefix matching)
hermes_node = lit_config.params['hermes_node']
source_dir = lit_config.params['source_dir']
# Tests that exercise the compile cache run it through this substitution,
# which clears the suite-wide disable above. Anything using plain
# %hermes-node still runs with the cache off.
config.substitutions.append(
    ('%hermes-node-cc',
     'env -u HERMES_NODE_DISABLE_COMPILE_CACHE ' + hermes_node))
# hermes-node-ui, the UI compositor binary (Task 6). `.get(..., '')`, not
# `lit_config.params['hermes_node_ui']`: a CMake-driven run always supplies
# it (HERMES_NODE_LIT_PARAMS in the top-level CMakeLists.txt, unconditionally
# -- see the `ui` feature probe below), but the hand-invocation CLAUDE.md's
# "Test Infrastructure" section documents names every other param explicitly
# and does not know about this one, and neither do the recipes in
# docs/notes/2026-08-23-macos-partial-link-spike.md,
# 2026-08-24-macos-validation-handoff.md and
# 2026-08-23-macos-partial-link-results.md. A bare `params['hermes_node_ui']`
# there is a KeyError raised while lit.cfg itself is loading -- before a
# single test runs -- which aborts configuration of the WHOLE suite, not
# just a `REQUIRES: ui` test. Same shape and same fix as kit_dir below:
# only register the substitution when a real value was given, since an
# empty one would register successfully and silently rewrite
# "%hermes-node-ui" to nothing rather than leaving it unsubstituted.
# Registered ahead of plain %hermes-node for the same reason %hermes-node-cc
# is: it is a longer name with %hermes-node as a literal prefix, and
# substitution order is match order, not specificity -- swapping the two
# would rewrite "%hermes-node-ui" into "<hermes-node path>-ui" instead of
# the binary this substitution actually names. That ordering constraint
# still holds here, conditional or not.
hermes_node_ui = lit_config.params.get('hermes_node_ui', '')
if hermes_node_ui:
    config.substitutions.append(('%hermes-node-ui', hermes_node_ui))
else:
    # Absence is not neutral, and leaving it unregistered is not safe either:
    # "%hermes-node-ui" is then matched by the %hermes-node substitution
    # below and rewritten to "<hermes-node path>-ui", which in an in-tree
    # build happens to name the real binary -- so the test passes while no
    # longer exercising the substitution it names. That is the silent-green
    # shape this suite keeps being bitten by, reached through absence rather
    # than through ordering. Register something that cannot resolve, so a
    # run without the param fails loudly instead.
    config.substitutions.append(
        ('%hermes-node-ui', '/nonexistent/hermes-node-ui-was-not-configured'))
config.substitutions.append(('%hermes-node', hermes_node))


def _register_path_param(name, substitution):
    """Register %substitution from a param, or something that cannot resolve.

    Absence is never neutral here, and leaving a substitution unregistered
    is the worse of the two failure modes: lit would leave the literal
    "%sgp_objdir" in the command line, a shell would treat it as a relative
    path, and the error a reader sees names a directory nobody configured.
    Worse for names that share a prefix with a registered one -- which is
    how "%hermes-node-ui" silently became "<hermes-node path>-ui" and passed
    a test that had stopped exercising anything (see its comment above).

    So an absent param registers a path that provably does not exist, and
    the test fails loudly naming it.
    """
    value = lit_config.params.get(name, '')
    if not value:
        value = '/nonexistent/' + name + '-was-not-configured'
    config.substitutions.append((substitution, value))


# The interpreter CMake found. Not `python3` off PATH: two tests run repo
# scripts, and a suite quietly using a different interpreter from the build
# is the same drift as a param lit trusts rather than verifies (RULING 37).
_register_path_param('python', '%python')
# The wrapper every window test runs under, `%with-display <seconds>
# COMMAND...` (utils/with-display.py), and the time limit every other UI
# RUN line uses, `%timeout`. One spelling for both platforms:
#
#  - On Linux with-display.py `exec`s `timeout <seconds> <python>
#    utils/with-xvfb.py COMMAND...` -- the identical process tree to the
#    `timeout <seconds> %with-xvfb` the RUN lines spelled before. The
#    private Xvfb replaces `xvfb-run -a`, whose choice of display is not
#    atomic: two parallel runs could be handed the same number, and then one
#    failed before any of our code ran or -- worse -- both shared one
#    server, and with it one clipboard. `Xvfb -displayfd` claims the display
#    itself.
#  - On macOS it serialises window tests machine-wide on one lock
#    (/tmp/hermes-node-ui-display.lock), keeps the window from activating,
#    gives the run a private pasteboard and applies the limit itself. The
#    limit starts once the lock is held and bounds only the command;
#    queueing for the lock has its own budget
#    (HERMES_NODE_UI_DISPLAY_LOCK_WAIT, default 1800 s), and exhausting it
#    exits 125, not 124. See its docstring.
#
# `%timeout` is GNU `timeout` on Linux and utils/timeout.py on macOS, on
# every release, so the suite does not depend on which macOS ships
# /usr/bin/timeout. Both accept `--foreground`.
#
# Built from the same interpreter as %python rather than a param of its own:
# both halves are already configured, and a third path could only disagree.
_python = (lit_config.params.get('python', '') or
           '/nonexistent/python-was-not-configured')
_with_display = [_python,
                 os.path.join(source_dir, 'utils', 'with-display.py')]
config.substitutions.append(('%with-display', ' '.join(_with_display)))
if sys.platform == 'darwin':
    config.substitutions.append(
        ('%timeout',
         _python + ' ' + os.path.join(source_dir, 'utils', 'timeout.py')))
else:
    config.substitutions.append(('%timeout', 'timeout'))
# The generated sokol_gfx rename header, and the directory holding the two
# compiled sokol_gfx objects. Registered before %source_dir below only for
# tidiness -- none of the three is a prefix of another.
_register_path_param('sgp_rename_h', '%sgp_rename_h')
_register_path_param('sgp_objdir', '%sgp_objdir')
# The backend objects that CALL each instance (gl_backend.cpp.o and
# gl_present.cpp.o on Linux), for test/sokol-isolation.js's user-object
# rule. Named by lib/compositor-gpu/CMakeLists.txt rather than spelled
# here, because which file holds the backend is that directory's decision
# and a different one on macOS.
_register_path_param('sgp_producing_user', '%sgp_producing_user')
_register_path_param('sgp_presenting_user', '%sgp_presenting_user')
# The UI compositor's reference addon (test/fixtures/hnui-demo/). Its CMake
# target only exists where a GPU backend was built, so unlike most params
# here it is genuinely absent on some configurations -- which is precisely
# what _register_path_param handles: an absent param becomes a path that
# provably does not exist, and the test that needs it fails naming it
# rather than passing against something else.
_register_path_param('hnui_demo_addon', '%hnui_demo_addon')
# The same addon built against a Sokol commit the host does not vendor, and
# the commit the host does (a plain string, registered the same way).
# Registered BEFORE `%source_dir` below: `%s` is a prefix of `%sokol_commit`.
_register_path_param('hnui_bad_version_addon', '%hnui_bad_version_addon')
_register_path_param('sokol_commit', '%sokol_commit')
# A foreign X11 clipboard owner (test/fixtures/hnui-demo/
# x11_selection_owner.c), absent wherever there is no X11 GL backend, and
# registered the same way for the same reason.
_register_path_param('x11_selection_owner', '%x11_selection_owner')
# The real-event driver (test/fixtures/hnui-demo/x11_window_driver.c), the
# same condition and the same handling.
_register_path_param('x11_window_driver', '%x11_window_driver')
config.substitutions.append(('%hermes', lit_config.params['hermes']))
config.substitutions.append(('%FileCheck', lit_config.params['FileCheck']))
config.substitutions.append(('%not', lit_config.params['not']))
config.substitutions.append(('%source_dir', source_dir))
if 'hello_addon' in lit_config.params:
    config.substitutions.append(('%hello_addon', lit_config.params['hello_addon']))

# The examples under examples/ carry a package.json but no node_modules --
# users run npm install themselves, and the default suite is offline, which is
# why check-hermes-node-examples is a separate target. A test that needs a real
# installed npm tree opts in with `REQUIRES: examples-installed` so it is
# reported UNSUPPORTED, not failing, on a checkout where nobody has installed
# it.
if os.path.isdir(
        os.path.join(source_dir, 'examples', 'yargs-cli', 'node_modules')):
    config.available_features.add('examples-installed')

# --build-exe links a standalone executable, which needs a compiler driver and
# a built kit (the hermes-node-kit target, EXCLUDE_FROM_ALL). check-hermes-node
# depends on that target, so the feature is on for every ordinary suite run;
# a bare `hermes-lit test/foo.js` with no --param kit_dir, or a checkout where
# nobody cut a kit, reports those tests UNSUPPORTED rather than failing them.
# The manifest is what the producer actually reads, so its presence -- not the
# directory's -- is the question worth asking.
kit_dir = lit_config.params.get('kit_dir', '')
if kit_dir and os.path.exists(os.path.join(kit_dir, 'kit.manifest')):
    config.available_features.add('linker-available')
    config.substitutions.append(('%kit_dir', kit_dir))

# HERMES_NODE_ENABLE_UI gates a preprocessor define (see
# tools/hermes-node/CMakeLists.txt), so --test-embedder-module simply does
# not exist in a binary built without it. This used to be decided by an
# `enable_ui` CMake param lit trusted rather than verified; deleting that one
# line from HERMES_NODE_LIT_PARAMS (CMakeLists.txt) made both tests that need
# it quietly report UNSUPPORTED forever in the only CI job that can run
# them, undetectably -- the same failure shape `linker-available` avoids by
# checking for a real kit.manifest instead of a flag saying one was built
# (RULING 37). So this runs the binary lit was actually pointed at and asks
# it directly, rather than trusting a value computed somewhere else at
# configure time: --test-embedder-module registers a "hermes-node:test"
# module exporting { ok: true }, and a build without the option exits
# nonzero (an unknown-option error) before any of that could run.
def _hermes_node_has_embedder_module_support(hermes_node_path):
    # The sentinel is assembled by the probe rather than written whole, so it
    # never appears in the argv this function then searches for in the
    # output. Spelled out, anything that merely reflects its command line
    # satisfies the probe without running a line of JavaScript: pointed at
    # /bin/echo, this turned the feature ON.
    probe = (
        "console.log(require('hermes-node:test').ok === true "
        "? 'HAS_EMBEDDER' + '_MODULE_SUPPORT' : 'NO')"
    )
    try:
        proc = subprocess.run(
            [hermes_node_path, '--test-embedder-module', '-e', probe],
            stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=30)
    except (OSError, subprocess.TimeoutExpired):
        # TimeoutExpired is not an OSError. Caught separately it would
        # propagate out of lit.cfg and abort configuration of the WHOLE
        # suite -- every test, not just the two this feature gates -- for a
        # binary that merely hangs.
        return False
    return (proc.returncode == 0 and
            b'HAS_EMBEDDER_MODULE_SUPPORT' in proc.stdout)

if _hermes_node_has_embedder_module_support(hermes_node):
    config.available_features.add('ui-enabled')

# The `ui` feature gates a `REQUIRES: ui` test on hermes-node-ui, the
# separate binary Task 6 adds -- a DIFFERENT thing from `ui-enabled` above,
# which is about a --test-embedder-module flag on the *plain* hermes-node
# binary. Conflating the two would let a ui-windowless-shaped test run
# against a binary that was never built.
#
# Decided the same way `ui-enabled` is and for the same reason (RULING 37):
# by running the binary lit was actually pointed at, here with --version,
# rather than trusting some value computed at configure time. Without this
# probe at all, every `REQUIRES: ui` test would be silently UNSUPPORTED
# forever instead of failing for its stated reason (finding 16) -- on a
# build with HERMES_NODE_ENABLE_UI on, where the binary exists and the
# tests are meant to run.
def _hermes_node_ui_has_version_support(hermes_node_ui_path):
    # Same two corrections as _hermes_node_has_embedder_module_support
    # above (hardened by "Harden the embedder-module lit probe", after a review found both
    # holes), plus a third this probe needed of its own:
    #  - TimeoutExpired is caught alongside OSError. It is not an OSError,
    #    and left uncaught it would propagate out of lit.cfg and abort
    #    configuration of the WHOLE suite -- every test, not just the ones
    #    this feature gates -- for a binary that merely hangs on --version.
    #  - the match is anchored to the START of stdout with startswith(),
    #    not "sentinel in stdout". The sentinel is never passed as one of
    #    this probe's own arguments, but argv[0] -- the path lit was given,
    #    which this repo's build always makes end in "hermes-node-ui" --
    #    is still part of the child's argv, and a decoy at that path
    #    printing it (a one-line shell script doing `echo "$0"`) turned the
    #    feature ON under a plain substring search: exactly the /bin/echo
    #    hole that hardening closed, reintroduced through this probe instead.
    #    argv[0] here is always an absolute path (HERMES_TOOLS_OUTPUT_DIR
    #    in the top-level CMakeLists.txt), so it can never itself start
    #    with the sentinel -- it starts with "/". A real hermes-node-ui
    #    prints "hermes-node-ui <version>" as the very first thing on
    #    stdout (see --version in tools/hermes-node-ui/main.cpp), so
    #    startswith() still accepts it.
    sentinel = 'hermes-node' + '-ui'
    try:
        proc = subprocess.run(
            [hermes_node_ui_path, '--version'],
            stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=30)
    except (OSError, subprocess.TimeoutExpired):
        return False
    return proc.returncode == 0 and proc.stdout.startswith(sentinel.encode())

if hermes_node_ui and _hermes_node_ui_has_version_support(hermes_node_ui):
    config.available_features.add('ui')

# The `sokol-validation` feature: the producing sokol_gfx instance was
# compiled with its validation layer, so an addon's malformed pass is a
# panic rather than undefined GL behaviour. Decided by running the binary
# (RULING 37), which reports it on a line of its own after the version --
# not from the build type, which this file is never told and which would
# be a second opinion about a fact the binary already knows. Off in a
# Release build, and on in the Debug/ASAN one CI runs the UI suite in.
def _hermes_node_ui_validates(hermes_node_ui_path):
    try:
        proc = subprocess.run(
            [hermes_node_ui_path, '--version'],
            stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=30)
    except (OSError, subprocess.TimeoutExpired):
        return False
    return (proc.returncode == 0 and
            b'\nsokol_gfx validation: on\n' in proc.stdout)

if 'ui' in config.available_features and \
        _hermes_node_ui_validates(hermes_node_ui):
    config.available_features.add('sokol-validation')

# The forcing function for `sokol-validation`, for the reason `display` has
# one below: a feature that only ever turns a test UNSUPPORTED can be lost
# with nothing going red. If the --version line changes its text, stops
# being printed, or the match above drifts, test/ui-sokol-validation.js --
# the only test that provokes a REAL validation failure on the drawing
# thread -- would quietly stop running in the one CI job that can run it.
# `%sokol-validation-state` reports the feature THIS FILE COMPUTED, and
# test/ui-sokol-validation-feature.js compares it with what the binary
# prints and, in CI, requires it to be on.
config.substitutions.append(
    ('%sokol-validation-state',
     'on' if 'sokol-validation' in config.available_features else 'off'))

# The backend hermes-node-ui was built with: `gl`, `metal` or `none`, read
# from the third line `--version` prints (`gpu backend: <name>`, from
# tools/hermes-node-ui/main.cpp, whose name comes from the backend's own
# implementation file). Decided by running the binary (RULING 37), for the
# same reason as `sokol-validation` above.
#
# It is what lets one test file serve both backends. A window test whose
# trace differs per backend checks `--check-prefixes=X,X-%ui-backend`:
# lines every backend prints stay under X, GL-only lines move to X-gl, and
# Metal's go under X-metal. A line nobody ported is visibly absent from the
# file rather than silently skipped -- and a backend that is misread here
# is caught by test/ui-backend-feature.js, which compares this value with
# the binary's line and with `%ui-backend-expected`.
#
# A value outside the three known names is read as `none`, so a reworded
# line cannot select a check prefix nobody wrote.
def _hermes_node_ui_backend(hermes_node_ui_path):
    try:
        proc = subprocess.run(
            [hermes_node_ui_path, '--version'],
            stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=30)
    except (OSError, subprocess.TimeoutExpired):
        return 'none'
    if proc.returncode != 0:
        return 'none'
    for line in proc.stdout.decode('utf-8', 'replace').splitlines():
        if line.startswith('gpu backend: '):
            name = line[len('gpu backend: '):]
            return name if name in ('gl', 'metal', 'none') else 'none'
    return 'none'

_ui_backend = (_hermes_node_ui_backend(hermes_node_ui)
               if 'ui' in config.available_features else 'none')
if _ui_backend != 'none':
    config.available_features.add('ui-backend-' + _ui_backend)
# What this PLATFORM is supposed to build -- a predicate, not a probe, so
# that test/ui-backend-feature.js can catch a binary built with the wrong
# backend (or none) while lit faithfully agrees with it. Registered BEFORE
# `%ui-backend`, of which it is a longer spelling: substitution order is
# match order.
config.substitutions.append(
    ('%ui-backend-expected', 'metal' if sys.platform == 'darwin' else 'gl'))
config.substitutions.append(('%ui-backend', _ui_backend))
# The GL backend's completion-mode override, for the two runs of
# test/ui-present.js and the one of test/ui-resize-generation.js that force
# a mode. Empty on any other backend: Metal has one completion mechanism
# and REFUSES this variable by name (a setting that silently does nothing
# is the failure shape this codebase refuses), so a RUN line that set it
# unconditionally could never pass there.
config.substitutions.append(
    ('%gl-completion-poll',
     'HERMES_NODE_UI_GL_COMPLETION=poll' if _ui_backend == 'gl' else ''))
config.substitutions.append(
    ('%gl-completion-block',
     'HERMES_NODE_UI_GL_COMPLETION=block' if _ui_backend == 'gl' else ''))

# The `ui-gpu` feature: a GPU backend was actually BUILT for this platform.
#
# A FOURTH thing, and the distinction is not academic -- getting it wrong
# turns macOS CI red. `ui-enabled` above is decided by running plain
# hermes-node with --test-embedder-module, and tools/hermes-node/
# CMakeLists.txt guards that flag on HERMES_NODE_ENABLE_UI with no platform
# condition at all. So on macOS with the option on, `ui-enabled` is ON --
# while lib/compositor-gpu/CMakeLists.txt returns early there (v1 GL is
# Linux-only; Metal is Task 16), so sgp_rename.h and the two sokol_gfx
# objects are never produced. Tests that read those artifacts would then
# fail on a platform that never claimed to build them, and CI sets the
# option for macos-latest as well as ubuntu-latest.
#
# The predicate mirrors lib/compositor-gpu/CMakeLists.txt's own guard
# EXACTLY rather than approximately: `if(NOT (UNIX AND NOT APPLE))` is
# `os.name == 'posix' and sys.platform != 'darwin'`. Writing it as
# `sys.platform.startswith('linux')` would be strictly narrower than the
# guard, so a non-Apple Unix that DID build the target would report these
# tests UNSUPPORTED with their artifacts sitting right there -- a silent
# skip, which is the failure mode this file exists to keep closing.
#
# Deliberately NOT `os.path.exists(sgp_rename_h)`. A missing artifact on a
# platform that does build one must fail LOUDLY rather than vanish (RULING
# 37). The question this feature answers is "does this platform have a
# backend at all", which is a property of the platform and not of the
# filesystem.
#
# This is the one place in this plan where UNSUPPORTED is the right answer:
# the platform genuinely has no implementation yet, rather than a probe
# being unable to tell whether it does.
if ('ui-enabled' in config.available_features and
        os.name == 'posix' and sys.platform != 'darwin'):
    config.available_features.add('ui-gpu')

# The `display` feature gates a test that opens a real window (RULING 34).
# A THIRD thing again, distinct from both features above: `ui-enabled` is
# about a flag on the plain hermes-node binary, `ui` about the separate
# hermes-node-ui binary existing and running, and this about whether this
# machine can give either of them a screen to draw on.
#
# On Linux, RULING 34 requires the RUN line to actually START Xvfb rather
# than merely detect that it is installed, and this probe holds up its end
# of that: it starts one, through the same %with-display wrapper the tests
# use, so the probe cannot pass by a route the tests do not take. A probe
# that only asked `shutil.which('Xvfb')` would turn the feature on wherever
# the package is installed, including where the server cannot start, and
# the test would then fail for a reason that has nothing to do with what it
# asserts.
#
# On macOS there is one real display, and the question is whether a window
# opened on it would ever be drawn. Two stages, cheapest first:
#
#  1. Is the console session usable -- unlocked, and on console? Asked of
#     `ioreg` (utils/macos_console_session.py), without opening a window.
#     This stage exists because the second cannot answer "no" quickly: with
#     the session locked or the display asleep a sokol_app Metal program
#     gets no frame at all -- Sokol starts on a CADisplayLink, which does
#     not fire then, and moves to its obscured timer only on an occlusion
#     CHANGE, which a window that was never visible never has -- so the
#     binary probe could only reach "false" through its full timeout, on
#     every lit invocation, and never say why.
#  2. Only then, gated on `ui-backend-metal`: run hermes-node-ui itself on
#     test/fixtures/hnui-demo/display_probe.js through %with-display, and
#     require exit 0, the probe's sentinel on stdout and the Metal
#     backend's `present: drawable acquired` trace on stderr -- a window
#     opened, was visible, and yielded a drawable. A locked screen, a
#     sleeping display, no window server and no Metal device all make it
#     false.
#
# **What this deliberately does NOT probe on Linux is GL.** Starting a
# display and getting a GL 4.3 core context out of it are different
# questions, and only the first belongs in a feature gate. A machine with a
# display but no usable renderer must see the window test go RED, not
# UNSUPPORTED -- lit scores UNSUPPORTED as success, so folding the GL
# question in here would convert exactly the failure worth knowing about
# into a green run. The split is: this decides whether the test is
# meaningful to run, and the test itself decides whether the window worked.
# (macOS cannot keep the same split: a drawable is the only evidence that
# the one shared display is usable at all.)
#
# Every probe returns (ok, reason). The reason is printed by lit when the
# feature is off and is what `%display-reason` expands to, so the canary
# test/ui-display-feature.js says WHY a promised display is missing.
def _display_probe_module():
    import importlib.util
    spec = importlib.util.spec_from_file_location(
        'hnui_display_probe',
        os.path.join(source_dir, 'utils', 'display_probe.py'))
    module = importlib.util.module_from_spec(spec)
    spec.loader.exec_module(module)
    return module


def _can_start_a_display():
    # utils/display_probe.py's xvfb_probe(): an Xvfb started through the
    # same %with-display wrapper the tests use, and DISPLAY reached the
    # command. Its sentinel is assembled by the CHILD shell (`"XVFB_""OK"`
    # is two argv fragments, concatenated only when sh runs echo), so
    # anything that merely reflects its command line fails the probe -- the
    # hole found twice already, once with /bin/echo, once through argv[0].
    # Every failure, a hang included, comes back as (False, reason): an
    # exception out of lit.cfg would abort configuration of the WHOLE
    # suite rather than just switching this feature off.
    return _display_probe_module().xvfb_probe(_with_display)


def _macos_console_session():
    import importlib.util
    spec = importlib.util.spec_from_file_location(
        'hnui_macos_console_session',
        os.path.join(source_dir, 'utils', 'macos_console_session.py'))
    module = importlib.util.module_from_spec(spec)
    spec.loader.exec_module(module)
    return module.query()


def _macos_window_draws():
    usable, reason = _macos_console_session()
    if not usable:
        return False, reason
    if 'ui-backend-metal' not in config.available_features:
        return False, 'hermes-node-ui has no Metal backend'
    # utils/display_probe.py's window_probe(): its own lock-wait budget, an
    # outer timeout derived so the wrapper is never killed from outside
    # while the window may be up, the whole session killed if it fires
    # anyway, and "display busy" reported as such rather than as "no
    # display".
    probe = os.path.join(source_dir, 'test', 'fixtures', 'hnui-demo',
                         'display_probe.js')
    return _display_probe_module().window_probe(
        _with_display, hermes_node_ui, probe)


# Gated on `ui`, so the probe does not start an X server (or open a window)
# on a configuration where nothing could use one. Every display-gated test
# also requires `ui` (they all run hermes-node-ui), so this costs no
# coverage -- and without it, an ordinary build with the UI option OFF paid
# for an Xvfb startup on every single lit configuration load, including
# `hermes-lit` runs on one unrelated test file.
if 'ui' not in config.available_features:
    _display_ok, _display_reason = False, 'hermes-node-ui is not available'
elif sys.platform == 'darwin':
    _display_ok, _display_reason = _macos_window_draws()
else:
    _display_ok, _display_reason = _can_start_a_display()
if _display_ok:
    config.available_features.add('display')
elif 'ui' in config.available_features:
    lit_config.note('display: ' + _display_reason)
# A display that exists but was BUSY -- another lit invocation or a hand run
# held the machine-wide display lock for the probe's whole budget -- is not
# a local choice like a missing Xvfb, so it must not leave the window tests
# UNSUPPORTED and the run green. `display-busy` turns
# test/ui-display-busy.js red, with the reason, on any machine.
if _display_reason.startswith('display busy:'):
    config.available_features.add('display-busy')

# --- The forcing function for `display`. ------------------------------
#
# Every other feature in this file has one, and this one had none. `ui` and
# `ui-enabled` are decided by RUNNING a binary (RULING 37), `ui-gpu` is a
# platform predicate deliberately NOT an os.path.exists, and
# test/ui-binary-exists.js exists solely so a regression in the `ui` probe
# cannot silently turn its neighbours UNSUPPORTED. `display` had nothing:
# drop `xvfb` from the apt line in .github/workflows/ci.yml and the probe
# above simply returns False, ui-create-window.js and ui-present.js report
# UNSUPPORTED, and `check-hermes-node` exits 0 -- while those two are the
# ONLY tests that execute the GL backend, the surface protocol, presenting,
# the capture hook or the publication id. The suite would still LOOK like it
# exercises the UI, because ui-route-refusal.js, sokol-rename.js and
# sokol-isolation.js keep running.
#
# The canary cannot be a plain "display must be on", and that is exactly why
# this feature was made a probe in the first place: it would then go red on
# a developer machine with no Xvfb installed, for a package nobody agreed to
# install. So the assertion is narrowed to the configuration where the
# absence is a defect rather than a local choice -- a machine that HAS a GPU
# backend (so the window tests are meaningful at all) and that says it is CI
# (so somebody wrote a workflow promising to install xvfb).
#
# `%display-state` reports the feature THIS FILE COMPUTED rather than
# re-running the probe, which is the point: a probe that goes wrong for any
# reason -- a missing package, a changed Xvfb, a timeout under load --
# is what the canary must see, not a second opinion about displays.
config.substitutions.append(
    ('%display-state',
     'on' if 'display' in config.available_features else 'off'))
# Why, in a few words -- printed by the canary when the feature is off.
# Contains no `%`, so it cannot start another substitution.
config.substitutions.append(('%display-reason', _display_reason))

# GitHub Actions sets both of these; CI alone is the near-universal
# convention. Read from the ambient environment rather than from
# config.environment, which ShTest REPLACES rather than merges (see the top
# of this file), so the variable a workflow exported is only visible here.
if os.environ.get('CI') or os.environ.get('GITHUB_ACTIONS'):
    config.available_features.add('ci')

# `display-expected`: this machine PROMISED a display, so `display` being
# off is a defect here rather than a local choice. It is what narrows the
# canary test/ui-display-feature.js. True on Linux CI, which installs xvfb
# (.github/workflows/ci.yml), and wherever the ambient environment sets
# HERMES_NODE_UI_EXPECT_DISPLAY=1 -- which every Mac command in the Task 16
# plan does, so a probe regression there is red rather than a suite of
# UNSUPPORTED window tests. NOT macOS CI: nobody knows yet whether GitHub's
# macOS runners have a Metal device and a window-server session.
if ((('ci' in config.available_features) and sys.platform != 'darwin') or
        os.environ.get('HERMES_NODE_UI_EXPECT_DISPLAY') == '1'):
    config.available_features.add('display-expected')

# A program that runs and exits nonzero, used as a stand-in for a compiler
# driver that rejects what it was handed. It is /bin/false on Linux and
# /usr/bin/false on macOS -- there is no /bin/false here at all -- so the path
# cannot be written literally in a test. Resolved from a fixed list rather
# than from PATH so that the manifest a test writes names an absolute program,
# which is what the producer's own error message then quotes back.
config.substitutions.append(
    ('%false',
     next((p for p in ('/bin/false', '/usr/bin/false') if os.path.exists(p)),
          'false')))

# Restores an ad-hoc signature after a test has patched bytes inside a linked
# executable. On Apple Silicon the kernel SIGKILLs a Mach-O whose signature no
# longer matches its pages, so a test that corrupts an embedded payload and
# expects the program to report the corruption itself never reaches main() --
# it dies with signal 9 before any of our code runs. Re-signing puts the test
# back on the path it means to exercise. A no-op everywhere else, where
# patching a binary needs no ceremony.
config.substitutions.append(
    ('%resign',
     'codesign -f -s - ' if sys.platform == 'darwin' else 'true '))

config.excludes = ['test-typescript-module.ts', 'fixtures']
