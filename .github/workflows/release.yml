name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for (e.g. v0.0.1).'
        required: true
      skip_tests:
        description: >-
          Manual override: build artifacts without running the test suite.
          Use only when a known test failure is blocking a release and the
          binary is otherwise verified.
        type: boolean
        default: false
      dry_run:
        description: >-
          Build, test and verify everything, then stop without publishing.
          For exercising this workflow itself. Artifacts are still uploaded
          to the run, so the tarball can be downloaded and inspected.
          The tag name has to satisfy two things at once, so use something
          shaped like "0.0.2-dry1": it must NOT start with "v", or pushing
          it fires the push trigger and publishes before you can dispatch;
          and it must start with a MAJOR.MINOR.PATCH number, because the tag
          becomes the stamped version and test-cli-version.js requires that
          shape. Push the tag, then dispatch it here with
          `gh workflow run release.yml --ref <tag> -f tag=<tag>
          -f dry_run=true` -- --ref matters, since without it gh dispatches
          the default branch's copy of this file, which may not know about
          these inputs at all.
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# RELEASE_TAG resolves to either the manually-entered tag (workflow_dispatch)
# or the pushed tag (push). Used everywhere the workflow needs the tag name.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-linux:
    name: Build (linux-x64)
    runs-on: ubuntu-latest
    # Built inside AlmaLinux 8, not on the runner. Symbol versions bind against
    # the host libc at link time, and glibc's own headers redirect to newer
    # entry points on newer systems, so an artifact built on ubuntu-latest
    # requires glibc 2.39 and refuses to start on anything older. Nothing in
    # this source needs that: every symbol above 2.34 was a feature check or a
    # header redirect that resolves the other way here, with no code change.
    # Measured floor in this image is 2.28, which is also Node's own Tier 1 x64
    # requirement (its BUILDING.md: Ubuntu 20.04, Debian 10, RHEL 8).
    #
    # The image is pinned by tag rather than digest deliberately: 8.x minor
    # updates never raise the glibc soname, and the floor is asserted below
    # anyway, so a drifting tag cannot silently regress the artifact.
    container: docker.io/library/almalinux:8
    steps:
      # Must precede checkout: actions/checkout shells out to git for
      # submodules, and this image ships none.
      # ccache lives in EPEL, so epel-release goes first and separately: dnf
      # aborts the whole transaction on one unresolvable name, which is how an
      # earlier version of this step failed on every package at once.
      #
      # Deliberately no ninja. It is not in EPEL but in powertools, and the
      # version there is 1.8.2; Makefiles are what this job was actually
      # validated against, end to end, including the kit and the two checks
      # below. Enabling powertools for a faster generator is a fine change to
      # make later, on the strength of a run rather than a guess.
      - name: Install toolchain
        run: |
          dnf install -y epel-release
          dnf install -y cmake clang python3 git make ccache binutils

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-release-linux-${{ github.sha }}
          restore-keys: |
            ccache-release-linux-

      # EPEL 8 ships ccache 3.7, which defaults its cache to ~/.ccache -- not
      # the ~/.cache/ccache that 4.x uses and that the restore step above
      # names. Left implicit, the cache would silently never hit. Setting
      # CCACHE_DIR pins it for both, and exporting it into GITHUB_ENV carries
      # it to the build steps.
      - name: Configure ccache
        shell: bash
        run: |
          export CCACHE_DIR="${HOME}/.cache/ccache"
          echo "CCACHE_DIR=${CCACHE_DIR}" >> "$GITHUB_ENV"
          mkdir -p "${CCACHE_DIR}"
          ccache -M 3G

      # No -G Ninja here, unlike the macOS job: see the toolchain step.
      #
      # CMAKE_POSITION_INDEPENDENT_CODE is load-bearing and specific to
      # building in this image. AlmaLinux 8's clang defaults to non-PIE where
      # Ubuntu's defaults to PIE, so without it the kit's objects carry
      # absolute relocations and every --build-exe on a PIE-default
      # distribution -- Ubuntu 22.04 and 24.04, Debian 12, Fedora -- fails
      # with "relocation R_X86_64_32S ... can not be used when making a PIE
      # object". PIC objects link under either default, so the kit stops
      # caring what the user's toolchain prefers. Shipped broken once, in
      # v0.0.2-rc2; see dz 01a06842-1313.
      - name: Configure CMake
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DHERMES_NODE_VERSION="${VERSION}"

      - name: Build & test (gated)
        if: ${{ inputs.skip_tests != true }}
        run: cmake --build build --target check-hermes-node

      - name: Build only (manual override; tests skipped)
        if: ${{ inputs.skip_tests == true }}
        run: cmake --build build --target hermes-node

      # hermes-node-kit is EXCLUDE_FROM_ALL, so neither build above reaches it
      # on its own. check-hermes-node does DEPEND on it, which makes this a
      # no-op on the tested path and the only source of a kit on the
      # skip_tests one. Cheap either way.
      - name: Build the build-exe kit
        run: cmake --build build --target hermes-node-kit

      # The reason this job runs in a container at all, asserted rather than
      # trusted. Catches both a base-image change that raises the floor and a
      # new dependency that reaches for a newer glibc entry point.
      - name: Assert the glibc floor
        shell: bash
        run: |
          max=$(objdump -T build/bin/hermes-node \
                | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol version required: ${max}"
          highest=$(printf '%s\n%s\n' "$max" "GLIBC_2.28" | sort -V | tail -1)
          if [ "$highest" != "GLIBC_2.28" ]; then
            echo "glibc floor regressed: needs ${max}, budget is GLIBC_2.28" >&2
            exit 1
          fi

      # Shipping a kit that cannot link is worse than shipping none, and the
      # failure would land in a user's toolchain rather than ours. Build a real
      # executable with it and run the result.
      - name: Smoke-test the kit
        shell: bash
        run: |
          echo 'console.log("kit smoke ok");' > "${RUNNER_TEMP}/hello.js"
          ./build/bin/hermes-node \
            --build-bundle="${RUNNER_TEMP}/hello.hbb" "${RUNNER_TEMP}/hello.js"
          ./build/bin/hermes-node \
            --build-exe="${RUNNER_TEMP}/hello" --kit="${PWD}/build/kit" \
            "${RUNNER_TEMP}/hello.hbb"
          out=$("${RUNNER_TEMP}/hello")
          if [ "$out" != "kit smoke ok" ]; then
            echo "kit-built executable printed '${out}'" >&2
            exit 1
          fi
          echo "kit OK"

      - name: Version sanity check
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          reported=$(./build/bin/hermes-node --version | awk '{print $2}')
          if [ "$reported" != "$VERSION" ]; then
            echo "Version mismatch: binary reports '$reported', tag is '$VERSION'" >&2
            exit 1
          fi
          echo "Version OK: $reported"

      - name: Strip binary
        run: strip build/bin/hermes-node

      - name: Stage release tree
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          NAME="hermes-node-${VERSION}-linux-x64"
          mkdir -p "staging/${NAME}/kit"
          cp build/bin/hermes-node "staging/${NAME}/"
          cp LICENSE README.md THIRD_PARTY_LICENSES.md "staging/${NAME}/"
          # resolveKitDir() defaults to <dir of the realpath'd exe>/kit, so this
          # layout is what makes --build-exe work with no --kit flag.
          #
          # Named individually rather than copied wholesale: kit.stamp is a
          # build-system artifact that should not ship, and an explicit list
          # fails loudly if make-kit.py ever renames an output instead of
          # quietly shipping an incomplete kit. The archives are deliberately
          # NOT stripped -- they are link inputs.
          cp build/kit/kit.manifest \
             build/kit/libhermes-node-kit.a \
             build/kit/libhermesNapi.a \
             build/kit/hermes-node-bundle-main.o \
             "staging/${NAME}/kit/"
          echo "STAGING_NAME=${NAME}" >> "$GITHUB_ENV"

      - name: Create tarball
        shell: bash
        run: |
          (cd staging && tar czf "../${STAGING_NAME}.tar.gz" "${STAGING_NAME}")
          sha256sum "${STAGING_NAME}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STAGING_NAME }}
          path: ${{ env.STAGING_NAME }}.tar.gz
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache -s

  # The kit exists to be used on a machine that is not the build machine, and
  # nothing was testing that. build-linux's own smoke test links inside the
  # image that cut the kit, where the toolchain agrees with itself by
  # construction, so it cannot see a kit-versus-host mismatch -- and one
  # shipped: v0.0.2-rc2's kit was non-PIE and failed to link on every
  # PIE-default distribution (dz 01a06842-1313).
  #
  # This job is that missing half. It runs on a bare ubuntu-latest, which is
  # PIE-default and therefore exactly the configuration that broke, unpacks
  # the tarball a user would download, and builds an executable from it with
  # no --kit flag at all.
  verify-kit-linux:
    name: Verify kit on a PIE-default host (linux-x64)
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Download the linux tarball
        uses: actions/download-artifact@v4
        with:
          pattern: hermes-node-*-linux-x64
          merge-multiple: true
          path: dist

      - name: Unpack it the way a user would
        shell: bash
        run: |
          mkdir -p rel
          tar xzf dist/hermes-node-*-linux-x64.tar.gz -C rel
          find rel -maxdepth 2 -type f | sort

      - name: Build an executable from the shipped kit, with no --kit
        shell: bash
        run: |
          BIN=$(echo rel/*/hermes-node)
          echo 'console.log("kit works off the build machine");' > hello.js
          "$BIN" --build-bundle=hello.hbb hello.js
          "$BIN" --build-exe=hello hello.hbb
          out=$(./hello)
          if [ "$out" != "kit works off the build machine" ]; then
            echo "executable printed '${out}'" >&2
            exit 1
          fi
          # ET_DYN means the link really was PIE, so a pass here cannot be a
          # vacuous one on a host that happened to link non-PIE.
          if ! readelf -h hello | grep -q 'DYN'; then
            echo "linked non-PIE; this check did not exercise the PIE path" >&2
            exit 1
          fi
          echo "kit links and runs on a PIE-default host"

  build-macos-universal:
    name: Build (macos-universal)
    runs-on: macos-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      - name: Install toolchain
        run: brew install ninja ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-release-macos-${{ github.sha }}
          restore-keys: |
            ccache-release-macos-

      - name: Configure ccache
        run: ccache -M 3G

      - name: Configure CMake
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DHERMES_NODE_VERSION="${VERSION}"

      - name: Build & test (gated)
        if: ${{ inputs.skip_tests != true }}
        run: cmake --build build --target check-hermes-node

      - name: Build only (manual override; tests skipped)
        if: ${{ inputs.skip_tests == true }}
        run: cmake --build build --target hermes-node

      - name: Verify universal binary slices
        shell: bash
        run: |
          info=$(lipo -info build/bin/hermes-node)
          echo "$info"
          echo "$info" | grep -q "x86_64" || { echo "Missing x86_64 slice" >&2; exit 1; }
          echo "$info" | grep -q "arm64"  || { echo "Missing arm64 slice"  >&2; exit 1; }

      - name: Version sanity check (arm64 slice runs natively on the runner)
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          reported=$(./build/bin/hermes-node --version | awk '{print $2}')
          if [ "$reported" != "$VERSION" ]; then
            echo "Version mismatch: binary reports '$reported', tag is '$VERSION'" >&2
            exit 1
          fi
          echo "Version OK: $reported"

      - name: Strip binary
        run: strip -u -r build/bin/hermes-node

      - name: Ad-hoc codesign
        run: codesign --sign - --force --options runtime --timestamp=none build/bin/hermes-node

      - name: Stage release tree
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          NAME="hermes-node-${VERSION}-macos-universal"
          mkdir -p "staging/${NAME}"
          cp build/bin/hermes-node "staging/${NAME}/"
          cp LICENSE README.md THIRD_PARTY_LICENSES.md "staging/${NAME}/"
          echo "STAGING_NAME=${NAME}" >> "$GITHUB_ENV"

      - name: Create tarball
        shell: bash
        run: |
          (cd staging && tar czf "../${STAGING_NAME}.tar.gz" "${STAGING_NAME}")
          shasum -a 256 "${STAGING_NAME}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STAGING_NAME }}
          path: ${{ env.STAGING_NAME }}.tar.gz
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache -s

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, verify-kit-linux, build-macos-universal]
    # The only outward-facing step in this workflow, and the only one a dry
    # run skips: everything above still builds, tests and verifies. `inputs`
    # is empty on a tag push, so `!= true` leaves the normal path unguarded.
    if: ${{ inputs.dry_run != true }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la dist/

      - name: Generate SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          sha256sum hermes-node-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Detect pre-release
        id: prerelease
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
            echo "Detected pre-release tag: $RELEASE_TAG"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The publish job does not checkout the repo (it only downloads
          # artifacts), so `gh` cannot discover the remote from a .git dir.
          # GH_REPO tells the CLI which repository to target explicitly.
          GH_REPO: ${{ github.repository }}
        shell: bash
        working-directory: dist
        run: |
          # Idempotent: try `release create` first; if the release already
          # exists for this tag (re-run / manual-override scenario), upload
          # --clobber instead.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release for $RELEASE_TAG already exists; clobbering assets."
            gh release upload "$RELEASE_TAG" --clobber \
              hermes-node-*.tar.gz SHA256SUMS
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              ${{ steps.prerelease.outputs.flag }} \
              hermes-node-*.tar.gz SHA256SUMS
          fi
