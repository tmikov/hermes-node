import os
import sys
import lit.formats

config.name = 'hermes-node'
config.test_format = lit.formats.ShTest(True)
config.suffixes = ['.js', '.ts']
config.test_source_root = os.path.dirname(__file__)
config.test_exec_root = lit_config.params['test_exec_root']

# The compile cache is on by default. Off for the suite as a whole so tests
# never share state through the user's real cache directory and ordering does
# not become a variable; the compile-cache tests opt back in explicitly with
# their own directory, through the %hermes-node-cc substitution below.
#
# lit's ShTest replaces the environment rather than merging with the ambient
# one, which is why PATH has to be passed through explicitly.
config.environment['HERMES_NODE_DISABLE_COMPILE_CACHE'] = '1'
config.environment['PATH'] = os.environ.get('PATH', '')
# Point the default cache root inside the test tree. The suite-wide disable
# above is the primary guard, but %hermes-node-cc exists to clear it, so a
# future test that forgets to pass --compile-cache= would otherwise land in
# the developer's real ~/.cache. lit's default environment carries no HOME,
# so this is the only root that needs redirecting.
config.environment['XDG_CACHE_HOME'] = os.path.join(
    config.test_exec_root, 'xdg-cache')

# Substitutions (order matters: longer names first to avoid prefix matching)
hermes_node = lit_config.params['hermes_node']
source_dir = lit_config.params['source_dir']
# Tests that exercise the compile cache run it through this substitution,
# which clears the suite-wide disable above. Anything using plain
# %hermes-node still runs with the cache off.
config.substitutions.append(
    ('%hermes-node-cc',
     'env -u HERMES_NODE_DISABLE_COMPILE_CACHE ' + hermes_node))
config.substitutions.append(('%hermes-node', hermes_node))
config.substitutions.append(('%hermes', lit_config.params['hermes']))
config.substitutions.append(('%FileCheck', lit_config.params['FileCheck']))
config.substitutions.append(('%not', lit_config.params['not']))
config.substitutions.append(('%source_dir', source_dir))
if 'hello_addon' in lit_config.params:
    config.substitutions.append(('%hello_addon', lit_config.params['hello_addon']))

# The examples under examples/ carry a package.json but no node_modules --
# users run npm install themselves, and the default suite is offline, which is
# why check-hermes-node-examples is a separate target. A test that needs a real
# installed npm tree opts in with `REQUIRES: examples-installed` so it is
# reported UNSUPPORTED, not failing, on a checkout where nobody has installed
# it.
if os.path.isdir(
        os.path.join(source_dir, 'examples', 'yargs-cli', 'node_modules')):
    config.available_features.add('examples-installed')

# --build-exe links a standalone executable, which needs a compiler driver and
# a built kit (the hermes-node-kit target, EXCLUDE_FROM_ALL). check-hermes-node
# depends on that target, so the feature is on for every ordinary suite run;
# a bare `hermes-lit test/foo.js` with no --param kit_dir, or a checkout where
# nobody cut a kit, reports those tests UNSUPPORTED rather than failing them.
# The manifest is what the producer actually reads, so its presence -- not the
# directory's -- is the question worth asking.
kit_dir = lit_config.params.get('kit_dir', '')
if kit_dir and os.path.exists(os.path.join(kit_dir, 'kit.manifest')):
    config.available_features.add('linker-available')
    config.substitutions.append(('%kit_dir', kit_dir))

# A program that runs and exits nonzero, used as a stand-in for a compiler
# driver that rejects what it was handed. It is /bin/false on Linux and
# /usr/bin/false on macOS -- there is no /bin/false here at all -- so the path
# cannot be written literally in a test. Resolved from a fixed list rather
# than from PATH so that the manifest a test writes names an absolute program,
# which is what the producer's own error message then quotes back.
config.substitutions.append(
    ('%false',
     next((p for p in ('/bin/false', '/usr/bin/false') if os.path.exists(p)),
          'false')))

# Restores an ad-hoc signature after a test has patched bytes inside a linked
# executable. On Apple Silicon the kernel SIGKILLs a Mach-O whose signature no
# longer matches its pages, so a test that corrupts an embedded payload and
# expects the program to report the corruption itself never reaches main() --
# it dies with signal 9 before any of our code runs. Re-signing puts the test
# back on the path it means to exercise. A no-op everywhere else, where
# patching a binary needs no ceremony.
config.substitutions.append(
    ('%resign',
     'codesign -f -s - ' if sys.platform == 'darwin' else 'true '))

config.excludes = ['test-typescript-module.ts', 'fixtures']
